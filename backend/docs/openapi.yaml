openapi: 3.0.3
info:
  title: SignVoice REST API
  version: 1.0.0
  description: |
    REST API phục vụ ứng dụng SignVoice Flutter Android và Flutter Web.

    ## Xác thực (Authentication)

    API sử dụng JWT Bearer token cho xác thực:
    1. Đăng ký/đăng nhập để nhận access token và refresh token
    2. Thêm header `Authorization: Bearer {accessToken}` vào các request yêu cầu xác thực
    3. Khi access token hết hạn (401), dùng refresh token để nhận cặp token mới; token cũ bị thu hồi
    4. Web có thể refresh bằng cookie signvoice_refresh (HttpOnly, SameSite=Strict) và Origin được cho phép

    ## Vai trò (Roles)

    - **USER**: Người dùng thông thường (xem từ điển, lưu yêu thích, lịch sử)
    - **STAFF**: Nhân viên quản lý nội dung (tạo và chỉnh sửa bản nháp)
    - **ADMIN**: Quản trị viên hệ thống (quản lý người dùng, phê duyệt cuối cùng)

    Role tùy chỉnh lưu trong collection roles và được gán bằng customRoleId. API lấy permissions từ database ở mỗi request. ADMIN là alias để tương thích JWT; custom role chỉ được cấp bộ quyền đã chọn, không tự kế thừa quyền ADMIN. Không thể cấp hoặc quản lý quyền cao hơn quyền của người gọi.

    ## Chế độ Guest

    Người dùng có thể tạo tài khoản guest tạm thời mà không cần email/password.
    Guest có thể chuyển đổi thành tài khoản vĩnh viễn sau này.

    ## Giới hạn

    - **AI Recognition**: Chưa được tích hợp - các tính năng AI sẽ hiển thị thông báo "Tính năng AI chưa được tích hợp"
    - **OAuth**: Google/Facebook login chưa được cấu hình
    - **Email**: Xác thực email chưa được kích hoạt

  contact:
    name: SignVoice Team
    email: support@signvoice.example.com

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: /
    description: Same-origin server

tags:
  - name: System
    description: Kiểm tra sức khỏe hệ thống
  - name: Authentication
    description: Đăng ký, đăng nhập, quản lý phiên làm việc
  - name: Dictionary
    description: Quản lý từ điển ngôn ngữ ký hiệu
  - name: Categories
    description: Danh mục từ vựng
  - name: Favorites
    description: Danh sách yêu thích của người dùng
  - name: History
    description: Lịch sử tra cứu
  - name: Users
    description: Quản lý hồ sơ và cài đặt người dùng
  - name: Staff
    description: Công cụ quản lý nội dung cho nhân viên
  - name: Admin
    description: Quản trị hệ thống

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token nhận được từ endpoint đăng nhập

  schemas:
    TokenPair:
      type: object
      required: [ accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt ]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time

    AuthUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [ id, displayName, role, accountType, status, isGuest, createdAt, updatedAt ]
          properties:
            id:
              type: string
            isGuest:
              type: boolean
      properties:
        permissions:
          type: array
          items:
            type: string
            enum:
              - admin:access
              - staff:access
              - users:read
              - users:write
              - roles:read
              - roles:write
              - dictionary:read
              - dictionary:write
              - content:publish
              - categories:read
              - categories:write
              - sessions:read
              - sessions:write
        customRoleId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        customRoleName:
          type: string

    AuthData:
      type: object
      required: [ user, tokens ]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    User:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        email:
          type: string
          format: email
          example: "user@example.com"
        displayName:
          type: string
          example: "Nguyễn Văn A"
        role:
          type: string
          enum: [ USER, STAFF, ADMIN ]
          example: "USER"
        status:
          type: string
          enum: [ ACTIVE, SUSPENDED, DELETED ]
          example: "ACTIVE"
        accountType:
          type: string
          enum: [ LOCAL, GOOGLE, FACEBOOK, GUEST ]
          example: "LOCAL"
        avatarUrl:
          type: string
          nullable: true
          example: "https://example.com/avatar.jpg"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
            enum:
              - admin:access
              - staff:access
              - users:read
              - users:write
              - roles:read
              - roles:write
              - dictionary:read
              - dictionary:write
              - content:publish
              - categories:read
              - categories:write
              - sessions:read
              - sessions:write
        customRoleId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        customRoleName:
          type: string

    DictionaryEntry:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        word:
          type: string
          example: "Xin chào"
        definition:
          type: string
          example: "Lời chào hỏi khi gặp gỡ"
        videoUrl:
          type: string
          example: "https://example.com/videos/xin-chao.mp4"
        thumbnailUrl:
          type: string
          nullable: true
          example: "https://example.com/thumbs/xin-chao.jpg"
        categoryId:
          type: string
          example: "507f1f77bcf86cd799439011"
        imageUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
          example: [ "chào hỏi", "giao tiếp" ]
        difficulty:
          type: string
          enum: [ BASIC, INTERMEDIATE, ADVANCED ]
          example: "BASIC"
        usageExample:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [ DRAFT, PENDING, PUBLISHED, REJECTED, ARCHIVED ]
          example: "PUBLISHED"
        viewCount:
          type: integer
          example: 150
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: "Chào hỏi"
        slug:
          type: string
          example: "chao-hoi"
        description:
          type: string
          example: "Các từ vựng về lời chào hỏi"
        icon:
          type: string
          nullable: true
        sortOrder:
          type: integer
          example: 1
        wordCount:
          type: integer
          example: 25
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ ACTIVE, INACTIVE ]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Favorite:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        entryId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/DictionaryEntry'
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    SearchHistory:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        entryId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/DictionaryEntry'
        viewedAt:
          type: string
          format: date-time
        viewDuration:
          type: integer
          nullable: true

    UserSettings:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        theme:
          type: string
          enum: [ LIGHT, DARK, SYSTEM ]
          example: "SYSTEM"
        language:
          type: string
          example: "vi"
        notifications:
          type: object
          properties:
            email:
              type: boolean
            push:
              type: boolean
            newContent:
              type: boolean
        videoAutoplay:
          type: boolean
        videoQuality:
          type: string
          enum: [ AUTO, LOW, MEDIUM, HIGH ]
        offlineMode:
          type: boolean

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "AUTH_TOKEN_EXPIRED"
            message:
              type: string
              example: "Token has expired"
            details:
              type: object
        requestId:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        pages:
          type: integer
          example: 8

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Validation failed"
            details:
              type: object
              properties:
                field:
                  type: string
                  example: "email"
                message:
                  type: string
                  example: "Invalid email format"
    AdminRoleInput:
      type: object
      additionalProperties: false
      required:
        - name
        - key
        - permissions
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        key:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
          description: Mã duy nhất; không dùng USER, STAFF hoặc ADMIN.
        description:
          type: string
          maxLength: 500
        permissions:
          type: array
          items:
            type: string
            enum:
              - admin:access
              - staff:access
              - users:read
              - users:write
              - roles:read
              - roles:write
              - dictionary:read
              - dictionary:write
              - content:publish
              - categories:read
              - categories:write
              - sessions:read
              - sessions:write
          uniqueItems: true
    AdminRoleUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        key:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
          description: Mã duy nhất; không dùng USER, STAFF hoặc ADMIN.
        description:
          type: string
          maxLength: 500
        permissions:
          type: array
          items:
            type: string
            enum:
              - admin:access
              - staff:access
              - users:read
              - users:write
              - roles:read
              - roles:write
              - dictionary:read
              - dictionary:write
              - content:publish
              - categories:read
              - categories:write
              - sessions:read
              - sessions:write
          uniqueItems: true
      minProperties: 1
    AdminUserInput:
      type: object
      additionalProperties: false
      required:
        - email
        - displayName
        - password
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Có chữ và số.
        role:
          type: string
          enum:
            - USER
            - STAFF
            - ADMIN
          default: USER
        customRoleId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
    AdminUserUpdate:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        role:
          type: string
          enum:
            - USER
            - STAFF
            - ADMIN
        customRoleId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - DELETED
      minProperties: 1
    AdminDictionaryInput:
      type: object
      additionalProperties: false
      required:
        - word
        - definition
        - videoUrl
        - categoryId
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 200
        definition:
          type: string
          minLength: 5
          maxLength: 2000
        videoUrl:
          type: string
          format: uri
          pattern: ^https?://
        thumbnailUrl:
          type: string
        imageUrls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        categoryId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        difficulty:
          type: string
          enum:
            - BEGINNER
            - INTERMEDIATE
            - ADVANCED
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 50
        usageExample:
          type: string
          maxLength: 1000
        notes:
          type: string
          maxLength: 1000
    AdminDictionaryUpdate:
      type: object
      additionalProperties: false
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 200
        definition:
          type: string
          minLength: 5
          maxLength: 2000
        videoUrl:
          type: string
          format: uri
          pattern: ^https?://
        thumbnailUrl:
          type: string
        imageUrls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        categoryId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        difficulty:
          type: string
          enum:
            - BEGINNER
            - INTERMEDIATE
            - ADVANCED
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 50
        usageExample:
          type: string
          maxLength: 1000
        notes:
          type: string
          maxLength: 1000
      minProperties: 1
    AdminCategoryInput:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 80
        description:
          type: string
          maxLength: 500
        icon:
          type: string
          maxLength: 50
        sortOrder:
          type: integer
          minimum: 0
          maximum: 10000
        status:
          type: string
          enum:
            - ACTIVE
            - ARCHIVED
    AdminCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 80
        description:
          type: string
          maxLength: 500
        icon:
          type: string
          maxLength: 50
        sortOrder:
          type: integer
          minimum: 0
          maximum: 10000
        status:
          type: string
          enum:
            - ACTIVE
            - ARCHIVED
      minProperties: 1

paths:
  # System Health
  /health/live:
    get:
      tags:
        - System
      summary: Kiểm tra server đang chạy
      description: Endpoint đơn giản kiểm tra server có đang hoạt động hay không
      operationId: healthLive
      responses:
        '200':
          description: Server đang chạy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "ok"
                      timestamp:
                        type: string
                        format: date-time
                      uptime:
                        type: number
                        example: 12345.67

  /health/ready:
    get:
      tags:
        - System
      summary: Kiểm tra server sẵn sàng phục vụ
      description: Kiểm tra server và database đã kết nối và sẵn sàng
      operationId: healthReady
      responses:
        '200':
          description: Server và database sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "ready"
                      timestamp:
                        type: string
                        format: date-time
                      database:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          name:
                            type: string
        '503':
          description: Database chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Authentication
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản mới
      description: Tạo tài khoản người dùng mới với email và password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "Password123!"
                displayName:
                  type: string
                  example: "Nguyễn Văn A"
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AuthData'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      description: Đăng nhập bằng email và password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  example: "Password123!"
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuthData'
        '401':
          description: Email hoặc password không đúng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/guest:
    post:
      tags:
        - Authentication
      summary: Tạo tài khoản guest
      description: Tạo tài khoản guest tạm thời không cần email/password
      operationId: createGuest
      responses:
        '201':
          description: Tài khoản guest được tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuthData'
  /api/v1/auth/convert-guest:
    post:
      tags:
        - Authentication
      summary: Chuyển đổi tài khoản guest thành vĩnh viễn
      description: Thêm email và password cho tài khoản guest
      operationId: convertGuest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 50
      responses:
        '200':
          description: Chuyển đổi thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuthData'
        '400':
          description: Không phải tài khoản guest hoặc dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Làm mới access token
      description: Sử dụng refresh token để lấy access token mới
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Access token mới
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh token không hợp lệ hoặc hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/forgot-password:
    post:
      tags: [ Auth ]
      summary: Yêu cầu email đặt lại mật khẩu
      description: Không tiết lộ email có tồn tại. SMTP phải được cấu hình. Giới hạn mỗi tài khoản một yêu cầu trong 60 giây; liên kết có hiệu lực 15 phút.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Đã xử lý yêu cầu; phản hồi chung cho mọi địa chỉ email
        '400':
          description: Email không hợp lệ
        '429':
          description: Quá nhiều yêu cầu
        '503':
          description: Chưa cấu hình SMTP

  /api/v1/auth/reset-password:
    post:
      tags: [ Auth ]
      summary: Đặt mật khẩu mới bằng token nhận trong email
      description: Token dùng một lần. Mật khẩu mới 8–128 ký tự, có chữ cái và chữ số. Thu hồi mọi phiên đăng nhập cũ.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ token, newPassword ]
              properties:
                token:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Đã đặt lại mật khẩu, xóa refresh cookie; cần đăng nhập lại
        '400':
          description: Mật khẩu không hợp lệ hoặc token sai, hết hạn, đã dùng
        '429':
          description: Quá nhiều yêu cầu

