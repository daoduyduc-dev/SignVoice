openapi: 3.0.3
info:
  title: SignVoice REST API
  version: 1.0.0
  description: |
    REST API phục vụ ứng dụng SignVoice Flutter Android và Flutter Web.
    
    ## Xác thực (Authentication)
    
    API sử dụng JWT Bearer token cho xác thực:
    1. Đăng ký/đăng nhập để nhận access token và refresh token
    2. Thêm header `Authorization: Bearer {accessToken}` vào các request yêu cầu xác thực
    3. Khi access token hết hạn (401), dùng refresh token để lấy access token mới
    
    ## Vai trò (Roles)
    
    - **USER**: Người dùng thông thường (xem từ điển, lưu yêu thích, lịch sử)
    - **STAFF**: Nhân viên quản lý nội dung (tạo, chỉnh sửa, duyệt nội dung)
    - **ADMIN**: Quản trị viên hệ thống (quản lý người dùng, phê duyệt cuối cùng)
    
    ## Chế độ Guest
    
    Người dùng có thể tạo tài khoản guest tạm thời mà không cần email/password.
    Guest có thể chuyển đổi thành tài khoản vĩnh viễn sau này.
    
    ## Giới hạn
    
    - **AI Recognition**: Chưa được tích hợp - các tính năng AI sẽ hiển thị thông báo "Tính năng AI chưa được tích hợp"
    - **OAuth**: Google/Facebook login chưa được cấu hình
    - **Email**: Xác thực email chưa được kích hoạt
    
  contact:
    name: SignVoice Team
    email: support@signvoice.example.com

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: /
    description: Same-origin server

tags:
  - name: System
    description: Kiểm tra sức khỏe hệ thống
  - name: Authentication
    description: Đăng ký, đăng nhập, quản lý phiên làm việc
  - name: Dictionary
    description: Quản lý từ điển ngôn ngữ ký hiệu
  - name: Categories
    description: Danh mục từ vựng
  - name: Favorites
    description: Danh sách yêu thích của người dùng
  - name: History
    description: Lịch sử tra cứu
  - name: Users
    description: Quản lý hồ sơ và cài đặt người dùng
  - name: Staff
    description: Công cụ quản lý nội dung cho nhân viên
  - name: Admin
    description: Quản trị hệ thống

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token nhận được từ endpoint đăng nhập

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        email:
          type: string
          format: email
          example: "user@example.com"
        displayName:
          type: string
          example: "Nguyễn Văn A"
        role:
          type: string
          enum: [USER, STAFF, ADMIN]
          example: "USER"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED, DELETED]
          example: "ACTIVE"
        accountType:
          type: string
          enum: [GUEST, PERMANENT]
          example: "PERMANENT"
        avatarUrl:
          type: string
          nullable: true
          example: "https://example.com/avatar.jpg"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DictionaryEntry:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        word:
          type: string
          example: "Xin chào"
        definition:
          type: string
          example: "Lời chào hỏi khi gặp gỡ"
        videoUrl:
          type: string
          example: "https://example.com/videos/xin-chao.mp4"
        thumbnailUrl:
          type: string
          nullable: true
          example: "https://example.com/thumbs/xin-chao.jpg"
        categoryId:
          type: string
          example: "507f1f77bcf86cd799439011"
        imageUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
          example: ["chào hỏi", "giao tiếp"]
        difficulty:
          type: string
          enum: [BASIC, INTERMEDIATE, ADVANCED]
          example: "BASIC"
        usageExample:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, PENDING, PUBLISHED, REJECTED, ARCHIVED]
          example: "PUBLISHED"
        viewCount:
          type: integer
          example: 150
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: "Chào hỏi"
        slug:
          type: string
          example: "chao-hoi"
        description:
          type: string
          example: "Các từ vựng về lời chào hỏi"
        icon:
          type: string
          nullable: true
        sortOrder:
          type: integer
          example: 1
        wordCount:
          type: integer
          example: 25
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Favorite:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        entryId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/DictionaryEntry'
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    SearchHistory:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        entryId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/DictionaryEntry'
        viewedAt:
          type: string
          format: date-time
        viewDuration:
          type: integer
          nullable: true

    UserSettings:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        theme:
          type: string
          enum: [LIGHT, DARK, SYSTEM]
          example: "SYSTEM"
        language:
          type: string
          example: "vi"
        notifications:
          type: object
          properties:
            email:
              type: boolean
            push:
              type: boolean
            newContent:
              type: boolean
        videoAutoplay:
          type: boolean
        videoQuality:
          type: string
          enum: [AUTO, LOW, MEDIUM, HIGH]
        offlineMode:
          type: boolean

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "AUTH_TOKEN_EXPIRED"
            message:
              type: string
              example: "Token has expired"
            details:
              type: object
        requestId:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        pages:
          type: integer
          example: 8

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Validation failed"
            details:
              type: object
              properties:
                field:
                  type: string
                  example: "email"
                message:
                  type: string
                  example: "Invalid email format"

paths:
  # System Health
  /health/live:
    get:
      tags:
        - System
      summary: Kiểm tra server đang chạy
      description: Endpoint đơn giản kiểm tra server có đang hoạt động hay không
      operationId: healthLive
      responses:
        '200':
          description: Server đang chạy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "ok"
                      timestamp:
                        type: string
                        format: date-time
                      uptime:
                        type: number
                        example: 12345.67

  /health/ready:
    get:
      tags:
        - System
      summary: Kiểm tra server sẵn sàng phục vụ
      description: Kiểm tra server và database đã kết nối và sẵn sàng
      operationId: healthReady
      responses:
        '200':
          description: Server và database sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "ready"
                      timestamp:
                        type: string
                        format: date-time
                      database:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          name:
                            type: string
        '503':
          description: Database chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Authentication
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản mới
      description: Tạo tài khoản người dùng mới với email và password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "Password123!"
                displayName:
                  type: string
                  example: "Nguyễn Văn A"
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      description: Đăng nhập bằng email và password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  example: "Password123!"
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '401':
          description: Email hoặc password không đúng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/guest:
    post:
      tags:
        - Authentication
      summary: Tạo tài khoản guest
      description: Tạo tài khoản guest tạm thời không cần email/password
      operationId: createGuest
      responses:
        '201':
          description: Tài khoản guest được tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string

  /api/v1/auth/convert-guest:
    post:
      tags:
        - Authentication
      summary: Chuyển đổi tài khoản guest thành vĩnh viễn
      description: Thêm email và password cho tài khoản guest
      operationId: convertGuest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Chuyển đổi thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '400':
          description: Không phải tài khoản guest hoặc dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Làm mới access token
      description: Sử dụng refresh token để lấy access token mới
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Access token mới
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
        '401':
          description: Refresh token không hợp lệ hoặc hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Đăng xuất
      description: Hủy phiên đăng nhập hiện tại
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout-all:
    post:
      tags:
        - Authentication
      summary: Đăng xuất tất cả thiết bị
      description: Hủy tất cả phiên đăng nhập của người dùng
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đã đăng xuất khỏi tất cả thiết bị
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Lấy thông tin người dùng hiện tại
      description: Trả về thông tin chi tiết của người dùng đang đăng nhập
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Dictionary
  /api/v1/dictionary:
    get:
      tags:
        - Dictionary
      summary: Lấy danh sách từ điển đã xuất bản
      description: Tìm kiếm và lọc các từ điển với phân trang
      operationId: getDictionaryEntries
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
          description: Lọc theo danh mục
        - name: search
          in: query
          schema:
            type: string
          description: Tìm kiếm theo từ hoặc định nghĩa
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [BASIC, INTERMEDIATE, ADVANCED]
          description: Lọc theo độ khó
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Số lượng kết quả mỗi trang
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
          description: Bỏ qua n kết quả đầu tiên
      responses:
        '200':
          description: Danh sách từ điển
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DictionaryEntry'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      skip:
                        type: integer

    post:
      tags:
        - Dictionary
      summary: Tạo từ điển mới (STAFF/ADMIN)
      description: Tạo bản nháp từ điển mới
      operationId: createDictionaryEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - word
                - definition
                - videoUrl
                - categoryId
              properties:
                word:
                  type: string
                  example: "Xin chào"
                definition:
                  type: string
                  example: "Lời chào hỏi khi gặp gỡ"
                videoUrl:
                  type: string
                  example: "https://example.com/videos/xin-chao.mp4"
                categoryId:
                  type: string
                thumbnailUrl:
                  type: string
                imageUrls:
                  type: array
                  items:
                    type: string
                tags:
                  type: array
                  items:
                    type: string
                difficulty:
                  type: string
                  enum: [BASIC, INTERMEDIATE, ADVANCED]
                usageExample:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Từ điển được tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: '#/components/schemas/DictionaryEntry'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Không có quyền (yêu cầu STAFF hoặc ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/dictionary/popular:
    get:
      tags:
        - Dictionary
      summary: Lấy các từ phổ biến
      description: Trả về các từ điển được xem nhiều nhất
      operationId: getPopularEntries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Số lượng từ phổ biến cần lấy
      responses:
        '200':
          description: Danh sách từ phổ biến
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DictionaryEntry'

  /api/v1/dictionary/{id}:
    get:
      tags:
        - Dictionary
      summary: Lấy chi tiết từ điển
      description: Trả về thông tin chi tiết của một từ điển
      operationId: getDictionaryEntryById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID của từ điển
      responses:
        '200':
          description: Chi tiết từ điển
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: '#/components/schemas/DictionaryEntry'
        '404':
          description: Không tìm thấy từ điển
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Dictionary
      summary: Cập nhật từ điển (STAFF/ADMIN)
      description: Cập nhật thông tin từ điển
      operationId: updateDictionaryEntry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                word:
                  type: string
                definition:
                  type: string
                videoUrl:
                  type: string
                thumbnailUrl:
                  type: string
                imageUrls:
                  type: array
                  items:
                    type: string
                tags:
                  type: array
                  items:
                    type: string
                difficulty:
                  type: string
                usageExample:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: '#/components/schemas/DictionaryEntry'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy từ điển
          content:
            application/json:
              schema:
